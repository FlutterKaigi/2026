<!doctype html>
<html lang="ja">
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1"
  />
  <style>
    @font-face {
      font-family: VenueMap;
      src: url(data:font/ttf;base64,__FONT__) format("truetype");
      font-weight: 100 900;
      font-display: swap;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--background);
      color: var(--onSurface);
      font-family: VenueMap, sans-serif;
    }
    #stage,
    #labels {
      position: absolute;
      inset: 0;
    }
    #labels {
      pointer-events: none;
      overflow: hidden;
    }
    canvas {
      display: block;
      touch-action: none;
    }
    .label {
      position: absolute;
      transform: translate(-50%, -50%);
      min-width: 48px;
      min-height: 48px;
      padding: 4px 6px;
      border: 1px solid var(--outline);
      border-radius: 12px;
      font:
        700 calc(12px * var(--text-scale, 1))/1.4 VenueMap,
        sans-serif;
      color: var(--color);
      background: var(--surface);
      white-space: pre;
      pointer-events: auto;
      cursor: pointer;
      touch-action: manipulation;
    }
    .label.facility {
      font-weight: 600;
      font-size: calc(16px * var(--text-scale, 1));
    }
    .label.facility.wc {
      font-size: calc(12px * var(--text-scale, 1));
    }
    .label.selected {
      border: 2px solid var(--primary);
      color: var(--onPrimaryContainer);
      background: var(--primaryContainer);
    }
    .label:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 2px;
    }
    .label[hidden] {
      display: none;
    }
  </style>
  <div id="stage"></div>
  <div id="labels"></div>
  <script type="module">
    __VENDOR__;
    {
      const PLAN = __PLAN__;
      const ART_BOX = PLAN.artBox;
      const MAP_ART = "data:image/png;base64,__ART__";
      __SCENE__;
    }
  </script>
</html>
