name: app
description: "FlutterKaigi 2026 official application."
publish_to: "none"
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  data:
    path: ../../packages/data
  firebase_app_check: ^0.4.5
  firebase_core: ^4.10.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  hooks_riverpod: ^3.3.2
  flutter_hooks: ^0.21.3+1
  go_router: ^17.3.0
  slang: ^4.17.0
  slang_flutter: ^4.17.0
  talker_flutter: ^5.1.16
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1
  collection: ^1.19.1
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^3.4.1
  country_flags: ^4.1.2
  # 3.11.0 は sdk ^3.6.0 のまま新しい SDK でしか使えない API（JSAny.isA）を
  # 使っており、Flutter 3.41.7 の Web ビルド（dart2js）が失敗する。修正版が
  # 出たら上限を外す。
  firebase_core_web: ">=3.10.0 <3.11.0"
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  cloud_functions: ^6.3.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.0
  freezed: ^3.2.5
  go_router_builder: ^4.3.0
  slang_build_runner: ^4.17.0
  flutterkaigi_lints:
    path: ../../packages/flutterkaigi_lints

flutter:
  uses-material-design: true

  assets:
    - res/assets/dashumaru_magao.webp
    - res/assets/fonts/NotoSansJP/OFL.txt
    # Google 公式の Sign in with Google ボタン素材。
    - res/assets/google_sign_in/
    - res/assets/icons/
    - res/assets/shuriken-logo.png

  fonts:
    - family: Noto Sans JP
      fonts:
        - asset: res/assets/fonts/NotoSansJP/NotoSansJP-VariableFont.ttf
