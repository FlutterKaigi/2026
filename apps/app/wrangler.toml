"$schema" = "node_modules/wrangler/config-schema.json"
name = "flutterkaigi-2026-conference-app"
compatibility_date = "2026-07-01"
preview_urls = true

[assets]
directory = "./build/web"
not_found_handling = "single-page-application"

[[routes]]
custom_domain = true
pattern = "app-2026.flutterkaigi.jp"

# Keep published links and native associations on the previous app host alive.
[[routes]]
custom_domain = true
pattern = "2026-app.flutterkaigi.jp"
