name: Setup Firebase
description: WIF で認証し、Firebase SDK 設定の生成ツールを準備する
inputs:
  project-id:
    description: Firebase プロジェクトID
    required: true
  workload-identity-provider:
    description: WIF プロバイダー
    required: true
  service-account:
    description: 設定の読み取り用サービスアカウント
    required: true
runs:
  using: composite
  steps:
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        project_id: ${{ inputs.project-id }}
        workload_identity_provider: ${{ inputs.workload-identity-provider }}
        service_account: ${{ inputs.service-account }}
    - name: Firebase CLI と FlutterFire CLI を準備
      shell: bash
      run: |
        npm install --global firebase-tools@13.35.1
        dart pub global activate flutterfire_cli 1.4.0
        echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
