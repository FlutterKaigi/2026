name: Workflows CI

on:
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/**
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - .github/actions/**
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: ワークフローと共通アクションを検証
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
