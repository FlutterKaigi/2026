name: Workflows CI

on:
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/scripts/**
  workflow_dispatch:

concurrency:
  group: workflows-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: 配布スクリプトを検証
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: ワークフローと共通アクションを検証
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
