name: Deploy App

on:
  push:
    branches: [main]
    paths:
      - apps/app/**
      - packages/data/**
      - tool/generate_app_links.dart
      - .fvmrc
      - pubspec.yaml
      - .github/workflows/deploy_app.yaml
      - .github/workflows/deploy_app_ios.yaml
      - .github/workflows/deploy_app_android.yaml
      - .github/workflows/deploy_app_web.yaml
      - .github/workflows/ci_app.yaml
      - .github/actions/setup-flutter/**
      - .github/actions/setup-firebase/**
      - .github/scripts/ios_signing.py
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      environment:
        description: 配布する環境
        type: choice
        options: [all, stg, prod]
        default: all
      ios:
        description: iOS を TestFlight へ配布する
        type: boolean
        default: true
      android:
        description: Android を Google Play 内部テストへ配布する
        type: boolean
        default: true
      web:
        description: Web を配布する
        type: boolean
        default: true
      upload_to_play:
        description: Android を Google Play へ送信する（初回の AAB 作成のみの場合は無効）
        type: boolean
        default: true

permissions: {}

jobs:
  validate:
    uses: ./.github/workflows/ci_app.yaml
    permissions:
      contents: read

  ios:
    needs: [validate, web]
    if: ${{ !cancelled() && needs.validate.result == 'success' && (needs.web.result == 'success' || needs.web.result == 'skipped') && (github.event_name != 'workflow_dispatch' || inputs.ios) }}
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(inputs.environment && inputs.environment != 'all' && format('["{0}"]', inputs.environment) || '["stg","prod"]') }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy_app_ios.yaml
    with:
      environment: ${{ matrix.environment }}
    secrets:
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets[format('{0}_IOS_PROVISIONING_PROFILE_BASE64', matrix.environment == 'stg' && 'STG' || 'PROD')] }}

  android:
    needs: [validate, web]
    if: ${{ !cancelled() && needs.validate.result == 'success' && (needs.web.result == 'success' || needs.web.result == 'skipped') && (github.event_name != 'workflow_dispatch' || inputs.android) }}
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(inputs.environment && inputs.environment != 'all' && format('["{0}"]', inputs.environment) || '["stg","prod"]') }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy_app_android.yaml
    with:
      environment: ${{ matrix.environment }}
      upload_to_play: ${{ github.event_name != 'workflow_dispatch' || inputs.upload_to_play }}
    secrets:
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_KEY_PROPERTIES_BASE64: ${{ secrets.ANDROID_KEY_PROPERTIES_BASE64 }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64 }}

  web:
    needs: validate
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.web }}
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(inputs.environment && inputs.environment != 'all' && format('["{0}"]', inputs.environment) || '["stg","prod"]') }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy_app_web.yaml
    with:
      environment: ${{ matrix.environment }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
