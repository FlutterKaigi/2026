name: Deploy App iOS

on:
  workflow_call:
    inputs:
      environment:
        description: 配布先（stg または prod）
        type: string
        required: true
    secrets:
      APP_STORE_CONNECT_API_KEY_BASE64:
        required: true

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  deploy:
    name: ios (${{ inputs.environment }})
    concurrency:
      group: deploy-app-ios-${{ inputs.environment }}
      cancel-in-progress: false
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      XCODE_VERSION: "26.4.1"
      FIREBASE_PROJECT_ID: ${{ vars[format('{0}_FIREBASE_PROJECT_ID', inputs.environment == 'stg' && 'STG' || 'PROD')] }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ inputs.environment == 'stg' && 'jp.flutterkaigi.conf2026.stg' || vars.IOS_BUNDLE_ID }}
      APP_STORE_CONNECT_APP_ID: ${{ inputs.environment == 'stg' && '6806764849' || '6793148059' }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars[format('GCP_WORKLOAD_IDENTITY_PROVIDER_{0}', inputs.environment == 'stg' && 'STG' || 'PROD')] }}
      GCP_SERVICE_ACCOUNT: ${{ vars[format('GCP_SERVICE_ACCOUNT_{0}', inputs.environment == 'stg' && 'STG' || 'PROD')] }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Validate Xcode and iPhoneOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - uses: ./.github/actions/setup-flutter

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Resolve dependencies
        run: flutter pub get

      - name: Validate delivery configuration
        run: |
          for name in FIREBASE_PROJECT_ID APPLE_TEAM_ID IOS_BUNDLE_ID APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_API_KEY_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64 \
            GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured as a Repository Variable or Secret."
              exit 1
            fi
          done
          environment_file="apps/app/environments/.env.$DEPLOY_ENVIRONMENT"
          expected_project="$(sed -n 's/^FIREBASE_PROJECT_ID=//p' "$environment_file")"
          expected_bundle="$(sed -n 's/^IOS_BUNDLE_ID=//p' "$environment_file")"
          if [ "$FIREBASE_PROJECT_ID" != "$expected_project" ] || [ "$IOS_BUNDLE_ID" != "$expected_bundle" ]; then
            echo "::error::Firebase プロジェクトと Bundle ID を $environment_file に揃えてください。"
            exit 1
          fi

      - uses: ./.github/actions/setup-firebase
        with:
          project-id: ${{ env.FIREBASE_PROJECT_ID }}
          workload-identity-provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: 選択した環境の Firebase 設定を生成
        working-directory: apps/app
        run: >-
          flutterfire configure
          --yes
          --project="$FIREBASE_PROJECT_ID"
          --platforms=ios
          --ios-bundle-id="$IOS_BUNDLE_ID"
          --ios-build-config=Release
          --ios-out=ios/Runner/GoogleService-Info.plist
          --out=lib/firebase_options.dart

      - name: 生成した Firebase 設定を検証
        working-directory: apps/app
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print :PROJECT_ID' ios/Runner/GoogleService-Info.plist)" = "$FIREBASE_PROJECT_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' ios/Runner/GoogleService-Info.plist)" = "$IOS_BUNDLE_ID"
          grep -Fq "projectId: '$FIREBASE_PROJECT_ID'" lib/firebase_options.dart

      # Google サインイン(signInWithProvider)のブラウザフローがアプリへ戻る
      # には REVERSED_CLIENT_ID の URL スキーム登録が必要。Info.plist には
      # dev(Emulator)用スキームしかコミットされていないため、FlutterFire CLI が
      # 生成した本番値をアーカイブ前に挿入して検証する。
      - name: Register Google sign-in callback URL scheme
        working-directory: apps/app
        run: |
          reversed_client_id="$(/usr/libexec/PlistBuddy -c 'Print :REVERSED_CLIENT_ID' ios/Runner/GoogleService-Info.plist)"
          if [ -z "$reversed_client_id" ]; then
            echo "::error::REVERSED_CLIENT_ID was not found in GoogleService-Info.plist."
            exit 1
          fi
          /usr/libexec/PlistBuddy \
            -c 'Add :CFBundleURLTypes:1 dict' \
            -c 'Add :CFBundleURLTypes:1:CFBundleTypeRole string Editor' \
            -c 'Add :CFBundleURLTypes:1:CFBundleURLSchemes array' \
            -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes:0 string $reversed_client_id" \
            ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:1:CFBundleURLSchemes:0' ios/Runner/Info.plist \
            | grep -Fx "$reversed_client_id"

      - name: App Store Connect CLI を準備
        run: |
          python3 -m venv "$RUNNER_TEMP/codemagic-cli"
          "$RUNNER_TEMP/codemagic-cli/bin/pip" install codemagic-cli-tools==0.61.1
          echo "$RUNNER_TEMP/codemagic-cli/bin" >> "$GITHUB_PATH"

      - name: App Store Connect キーと書き出し設定を準備
        run: |
          umask 077
          mkdir -p "$HOME/.private_keys" "$RUNNER_TEMP/app-store-export"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d \
            > "$HOME/.private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          cp apps/app/ios/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"

      - name: 登録済みの最新ビルド番号に1を加算
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          app_version="$(sed -nE 's/^version: ([0-9]+[.][0-9]+[.][0-9]+).*/\1/p' apps/app/pubspec.yaml)"
          test -n "$app_version"
          latest_build_number="$(app-store-connect get-latest-testflight-build-number \
            "$APP_STORE_CONNECT_APP_ID" --platform IOS \
            --pre-release-version "$app_version" --disable-jwt-cache)"
          latest_build_number="${latest_build_number:-0}"
          if ! [[ "$latest_build_number" =~ ^[0-9]+$ ]]; then
            echo "::error::App Store Connect の最新ビルド番号を整数として取得できませんでした。"
            exit 1
          fi
          build_number=$((10#$latest_build_number + 1))
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "### iOS $DEPLOY_ENVIRONMENT: $app_version ($build_number)" >> "$GITHUB_STEP_SUMMARY"
          echo "登録済みの最新番号 $latest_build_number + 1; コミット: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Xcode environment
        run: cp "apps/app/environments/.env.$DEPLOY_ENVIRONMENT" apps/app/ios/Flutter/Environment.xcconfig

      - name: Configure iOS release
        working-directory: apps/app
        run: >-
          flutter build ios
          --config-only
          --no-codesign
          --no-pub
          --build-number="$BUILD_NUMBER"
          --dart-define-from-file=environments/.env.$DEPLOY_ENVIRONMENT
          --dart-define=FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID
          --dart-define=COMMIT_INFORMATION=${{ github.ref_name }}-${{ github.sha }}

      - name: Archive iOS app
        working-directory: apps/app
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/Runner.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_KEY_ISSUER_ID" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyPath "$HOME/.private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"

      - name: Export signed IPA
        working-directory: apps/app
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/ios/export \
            -allowProvisioningUpdates \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_KEY_ISSUER_ID" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyPath "$HOME/.private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"

      - name: IPA 内のアプリID・バージョン・ビルド番号を検証
        working-directory: apps/app
        run: |
          ipa_path="$(find build/ios/export -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa_path"
          verification_dir="$(mktemp -d "$RUNNER_TEMP/verify-ipa.XXXXXX")"
          unzip -q "$ipa_path" 'Payload/*.app/Info.plist' -d "$verification_dir"
          app_plist="$(find "$verification_dir/Payload" -mindepth 2 -maxdepth 2 -name Info.plist -print -quit)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_plist")" = "$IOS_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_plist")" = "$APP_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_plist")" = "$BUILD_NUMBER"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$app_plist")" = false

      - name: Upload IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FlutterKaigi-2026-ios-${{ env.DEPLOY_ENVIRONMENT }}-${{ env.BUILD_NUMBER }}
          path: apps/app/build/ios/export/*.ipa
          if-no-files-found: error

      - name: Upload IPA to App Store Connect
        working-directory: apps/app
        run: |
          ipa_path="$(find build/ios/export -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$ipa_path" ]; then
            echo "::error::Exported IPA was not found."
            exit 1
          fi
          xcrun altool \
            --upload-app \
            --file "$ipa_path" \
            --type ios \
            --apiIssuer "$APP_STORE_CONNECT_API_KEY_ISSUER_ID" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID"

      - name: 次の実行で同じ番号を使わないよう登録反映を確認
        timeout-minutes: 12
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          for attempt in {1..30}; do
            latest_build_number="$(app-store-connect get-latest-testflight-build-number \
              "$APP_STORE_CONNECT_APP_ID" --platform IOS \
              --pre-release-version "$APP_VERSION" --disable-jwt-cache)"
            if [[ "$latest_build_number" =~ ^[0-9]+$ ]] && (( 10#$latest_build_number >= BUILD_NUMBER )); then
              echo "App Store Connect へのビルド $BUILD_NUMBER の登録反映を確認しました。" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 20
          done
          echo "::error::アップロード後の登録反映を確認できません。再実行前に App Store Connect の処理状態を確認してください。"
          exit 1

      - name: 一時的な署名キーを削除
        if: ${{ always() }}
        run: rm -f "$HOME/.private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
