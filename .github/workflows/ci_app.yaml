name: App CI

on:
  pull_request:
    paths:
      - apps/app/**
      - packages/data/**
      - packages/flutterkaigi_lints/**
      - tool/generate_app_links.dart
      - tool/app_link_hosts.json
      - tool/app_link_origins.mjs
      - tool/generate_app_link_config*
      - test/generate_app_links_test.dart
      - apps/website/worker.js
      - apps/website/test/worker.test.mjs
      - .fvmrc
      - dprint.jsonc
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/ci_app.yaml
      - .github/workflows/deploy_app.yaml
      - .github/actions/**
      - .github/workflows/deploy_app_ios.yaml
      - .github/workflows/deploy_app_android.yaml
      - .github/workflows/deploy_app_web.yaml
  workflow_dispatch:
  workflow_call:

concurrency:
  group: app-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  style:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check documentation and configuration formatting
        uses: dprint/check@9cb3a2b17a8e606d37aae341e49df3654933fc23 # v2.3
        with:
          dprint-version: 0.55.2
          config-path: dprint.jsonc

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-flutter

      - name: Prepare Firebase options stub
        run: cp apps/app/lib/firebase_options.stub.dart apps/app/lib/firebase_options.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify Google sign-in plugin platforms
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          plugins = json.loads(Path("apps/app/.flutter-plugins-dependencies").read_text())["plugins"]
          expected = {
              "android": {"google_sign_in_android"},
              "ios": {"google_sign_in_ios"},
              "macos": {"google_sign_in_ios"},
          }
          assert expected.keys() <= plugins.keys()
          for platform, entries in plugins.items():
              actual = {p["name"] for p in entries if p["name"].startswith("google_sign_in_")}
              assert actual == expected.get(platform, set()), (platform, actual)
          PY

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed apps/app

      - name: Analyze app
        working-directory: apps/app
        run: dart analyze

      - name: Analyze data package
        working-directory: packages/data
        run: dart analyze

      - name: Test app
        working-directory: apps/app
        run: flutter test

      - name: Test app association files and legacy share links
        run: |
          node tool/generate_app_link_config.mjs --check
          python3 -m unittest discover -s .github/scripts -p test_app_link_config.py
          dart test test/generate_app_links_test.dart
          node --test tool/generate_app_link_config.test.mjs apps/website/test/worker.test.mjs

      - name: Test venue map labels
        working-directory: apps/app
        run: node --test tool/venue_map/label-layout.test.cjs

      - name: Test data package
        working-directory: packages/data
        run: flutter test

      - name: Test Web authentication
        working-directory: packages/data
        run: flutter test --platform chrome test/auth_repository_web_test.dart
