name: Preview App Web

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - apps/app/**
      - packages/data/**
      - tool/generate_app_links.dart
      - .fvmrc
      - pubspec.yaml
      - .github/workflows/preview_app_web.yaml
      - .github/workflows/deploy_app_web.yaml
      - .github/actions/setup-flutter/**
      - .github/actions/setup-firebase/**
  workflow_dispatch:

concurrency:
  group: preview-app-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  preview:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy_app_web.yaml
    with:
      environment: stg
      preview: true
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  comment:
    needs: preview
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - name: プレビュー URL を記録
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          message: |
            ## 📱 App Web Preview
            🔗 ${{ needs.preview.outputs.url }}

            🔑 Commit: `${{ github.event.pull_request.head.sha }}`
          comment-tag: deploy-conference-app-web
